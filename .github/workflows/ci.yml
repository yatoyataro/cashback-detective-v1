# .github/workflows/ci.yml
# Continuous Integration workflow
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test
      - run: cd frontend && npm ci && npm run lint

  eval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cashback_detective
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Run schema migration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cashback_detective
        run: |
          node -e "
            import pg from 'pg';
            import fs from 'fs';
            const { Pool } = pg;
            const pool = new Pool({ connectionString: process.env.DATABASE_URL, max: 1 });
            const sql = fs.readFileSync('neon/migrations/001_initial_schema.sql', 'utf-8');
            await pool.query(sql);
            const sql2 = fs.readFileSync('neon/migrations/002_seed_data.sql', 'utf-8');
            await pool.query(sql2);
            await pool.end();
            console.log('Schema and seed data loaded');
          "
      - name: Run evals
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cashback_detective
          EVAL_BASE_URL: http://localhost:3000
        run: |
          npm run dev &
          sleep 5
          npm run eval